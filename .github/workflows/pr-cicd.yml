name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      BASE_APP_NAME: avp
      AWS_REGION: eu-west-2
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps || true

      - name: Run unit tests
        run: npm run test:unit

      - name: Build app
        run: npm run build

      - name: Get PR number
        if: ${{ github.event_name == 'pull_request' }}
        id: pr_info
        run: |
          PR_NUMBER=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}

      - name: Expose and validate AWS role and region
        if: ${{ github.event_name == 'pull_request' }}
        id: expose_envs
        run: |
          ROLE="${{ secrets.AWS_ROLE_ARN }}"
          REGION="${{ env.AWS_REGION }}"
          echo "AWS_ROLE_ARN=$ROLE" >> "$GITHUB_OUTPUT"
          echo "AWS_REGION=$REGION" >> "$GITHUB_OUTPUT"

          case "$ROLE" in
            arn:aws:iam:*) ;;
            *)
              echo "ERROR: AWS_ROLE_ARN does not start with 'arn:aws:iam:' (got: $ROLE)" >&2
              exit 1
              ;;
          esac

          if [ "$REGION" != "eu-west-2" ]; then
            echo "ERROR: AWS_REGION is not 'eu-west-2' (got: $REGION)" >&2
            exit 1
          fi
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (assume OIDC role)
        if: ${{ github.event_name == 'pull_request' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::021685463033:role/matthew-avp-github-oidc-role
          aws-region: eu-west-2

      # Remote state is configured in terraform/main/backend.tf (hardcoded)

      - name: Setup Terraform
        if: ${{ github.event_name == 'pull_request' }}
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform create ECR repo
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          PR_NUMBER=${{ steps.pr_info.outputs.PR_NUMBER }}
          cd terraform/main
          terraform init -input=false -backend-config="key=state/global/main.tfstate"
          terraform apply -auto-approve -input=false -target=aws_ecr_repository.repo \
            -var="env_type=global" -var="env_id=main" -var="base_app_name=${BASE_APP_NAME}" -var="aws_region=${AWS_REGION}"
          REPO_URL=$(terraform output -raw repository_url)
          echo "REPO_URL=$REPO_URL" >> "$GITHUB_OUTPUT"
        id: terraform_repo
        env:
          BASE_APP_NAME: ${{ env.BASE_APP_NAME }}
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Build and push Docker image to ECR
        if: ${{ github.event_name == 'pull_request' }}
        id: build_and_push
        run: |
          PR_NUMBER=${{ steps.pr_info.outputs.PR_NUMBER }}
          REPO_URL=${{ steps.terraform_repo.outputs.REPO_URL }}
          IMAGE_TAG=pr-${PR_NUMBER}
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${REPO_URL%/*}
          docker build -t ${REPO_URL}:${IMAGE_TAG} .
          docker push ${REPO_URL}:${IMAGE_TAG}
          echo "IMAGE_URI=${REPO_URL}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Terraform create App Runner service
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          PR_NUMBER=${{ steps.pr_info.outputs.PR_NUMBER }}
          IMAGE_URI=${{ steps.build_and_push.outputs.IMAGE_URI }}
          cd terraform/main
          terraform init -input=false -backend-config="key=state/prs/pr-${PR_NUMBER}.tfstate"
          terraform apply -auto-approve -input=false -var="env_type=pr" -var="env_id=pr-${PR_NUMBER}" -var="image_identifier=${IMAGE_URI}" -var="base_app_name=${BASE_APP_NAME}" -var="aws_region=${AWS_REGION}"
          PREVIEW_URL=$(terraform output -raw preview_url)
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        id: terraform_apply
        env:
          BASE_APP_NAME: ${{ env.BASE_APP_NAME }}
          AWS_REGION: ${{ env.AWS_REGION }}
        # note: IMAGE_URI is pulled from previous step outputs

      - name: Post PR comment with preview URL
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          PR_NUMBER=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
          PREVIEW_URL=${{ steps.terraform_apply.outputs.PREVIEW_URL }}
          BODY=$(jq -nc --arg url "$PREVIEW_URL" '{body: ("Preview environment: " + $url)}')
          curl -s -S -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" \
            -d "$BODY" "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" >/dev/null
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}

      - name: Run UI happy-path (if PREVIEW_URL available)
        if: ${{ steps.terraform_apply.outputs.PREVIEW_URL }}
        run: |
          echo "Running Playwright e2e against $PREVIEW_URL"
          npx playwright test --config=playwright.config.ts
        env:
          PREVIEW_URL: ${{ steps.terraform_apply.outputs.PREVIEW_URL }}
