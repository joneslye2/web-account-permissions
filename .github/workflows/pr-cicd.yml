name: PR CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps || true

      - name: Run unit tests
        run: npm run test:unit

      - name: Build app
        run: npm run build

      - name: Compute preview env and post PR comment with preview URL
        if: ${{ github.event_name == 'pull_request' }}
        id: post_preview
        run: |
          PR_NUMBER=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
          PREVIEW_ENV="${BASE_APP_NAME}-${PR_ENV_PREFIX}${PR_NUMBER}"
          if [ -n "${{ secrets.PREVIEW_BASE_HOST }}" ]; then
            PREVIEW_URL="https://${PREVIEW_ENV}.${{ secrets.PREVIEW_BASE_HOST }}"
          else
            PREVIEW_URL="https://${PREVIEW_ENV}.preview.example.com"
          fi

          # Post comment to PR with the preview URL
          BODY=$(jq -nc --arg url "$PREVIEW_URL" '{body: ("Preview environment: " + $url)}')
          curl -s -S -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" \
            -d "$BODY" "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" >/dev/null

          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        env:
          BASE_APP_NAME: ${{ env.BASE_APP_NAME }}
          PR_ENV_PREFIX: ${{ env.PR_ENV_PREFIX }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}

      - name: Run UI happy-path (if PREVIEW_URL available)
        if: ${{ steps.post_preview.outputs.PREVIEW_URL }}
        run: |
          echo "Running Playwright e2e against $PREVIEW_URL"
          npx playwright test --config=playwright.config.ts
        env:
          PREVIEW_URL: ${{ steps.post_preview.outputs.PREVIEW_URL }}
