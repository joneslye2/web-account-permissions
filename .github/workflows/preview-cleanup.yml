name: Preview cleanup

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to clean up (for manual testing without closing the PR)'
        required: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_TENANT_ID: 6255c754-e30b-4758-bad0-d9051e73013b
      AZURE_NON_PROD_WEB_APP_CLIENT_ID: 671e9818-dea5-4b0d-ac43-7eaf5470894d
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure AWS credentials (assume OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::021685463033:role/matthew-avp-github-oidc-role
          aws-region: eu-west-2

      - name: Compute PR info and repo name
        id: info
        run: |
          PR_NUMBER=$(jq -r '.pull_request.number // .inputs.pr_number' "$GITHUB_EVENT_PATH")
          NAME_PREFIX=$(echo "avp" | tr '[:upper:]' '[:lower:]' | sed 's/_/-/g')
          REPO_NAME="${NAME_PREFIX}-previews"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "REPO_NAME=$REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "REPO_URL=021685463033.dkr.ecr.eu-west-2.amazonaws.com/${REPO_NAME}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Look up preview URL before destroy
        id: lookup
        run: |
          PR_NUMBER=${{ steps.info.outputs.PR_NUMBER }}
          cd terraform/environment
          terraform init -input=false -reconfigure -backend-config="key=state/prs/pr-${PR_NUMBER}.tfstate" || true
          PREVIEW_URL="https://$(terraform output -raw preview_url 2>/dev/null || true)"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      # Gated on there actually being something to destroy (same signal the
      # Azure steps below already use), and deliberately no `|| true` on the
      # destroy itself: that masked a real bug once already (image_identifier
      # below used to be a bare repo name, which fails App Runner's own
      # image_identifier regex validation - Terraform errored immediately,
      # and `|| true` turned that failure into a silent no-op that still
      # reported step success, leaving the service running).
      - name: Terraform destroy preview (App Runner)
        if: ${{ steps.lookup.outputs.PREVIEW_URL != 'https://' }}
        run: |
          PR_NUMBER=${{ steps.info.outputs.PR_NUMBER }}
          REPO_URL=${{ steps.info.outputs.REPO_URL }}
          cd terraform/environment
          # access_role_arn has no default (unlike msal_client_id) but its
          # actual value doesn't matter for a destroy - only real resources
          # in state get torn down, nothing here gets created.
          terraform destroy -auto-approve -input=false \
            -var="env_type=pr" \
            -var="env_id=pr-${PR_NUMBER}" \
            -var="image_identifier=${REPO_URL}:pr-${PR_NUMBER}" \
            -var="access_role_arn=arn:aws:iam::021685463033:role/avp-apprunner-ecr-access" \
            -var="base_app_name=avp" \
            -var="aws_region=eu-west-2"

      # Skipped for merged PRs: preview-cleanup (pull_request: closed) and
      # main-deploy (push: branches: [main]) both fire from the same merge
      # event as independent, unordered workflow runs. Deleting the pr-N
      # tag here could race main-deploy's image-promotion lookup, which
      # depends on that exact tag still existing. main-deploy deletes it
      # itself once promotion has actually succeeded. Only closed-without-
      # merging PRs (nothing will ever promote that image) get cleaned up
      # here; workflow_dispatch (manual testing) also cleans up since it's
      # never a real merge.
      - name: Delete ECR image
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == false }}
        run: |
          PR_NUMBER=${{ steps.info.outputs.PR_NUMBER }}
          REPO_NAME=${{ steps.info.outputs.REPO_NAME }}
          aws ecr batch-delete-image --repository-name "${REPO_NAME}" --image-ids imageTag=pr-${PR_NUMBER} || true

      - name: Azure login (OIDC, for Entra redirect URI automation)
        if: ${{ steps.lookup.outputs.PREVIEW_URL != 'https://' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_GRAPH_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Deregister PR preview redirect URI in Entra
        if: ${{ steps.lookup.outputs.PREVIEW_URL != 'https://' }}
        run: |
          PREVIEW_URL=${{ steps.lookup.outputs.PREVIEW_URL }}
          OBJECT_ID=$(az rest --method GET \
            --url "https://graph.microsoft.com/v1.0/applications?\$filter=appId eq '${WEB_APP_CLIENT_ID}'" \
            --query "value[0].id" -o tsv)
          CURRENT_URIS=$(az rest --method GET \
            --url "https://graph.microsoft.com/v1.0/applications/${OBJECT_ID}" \
            --query "spa.redirectUris" -o json)
          NEW_URIS=$(echo "$CURRENT_URIS" | jq -c --arg url "$PREVIEW_URL" '[.[] | select(. != $url)]')
          az rest --method PATCH \
            --url "https://graph.microsoft.com/v1.0/applications/${OBJECT_ID}" \
            --headers "Content-Type=application/json" \
            --body "$(jq -nc --argjson uris "$NEW_URIS" '{spa: {redirectUris: $uris}}')"
        env:
          WEB_APP_CLIENT_ID: ${{ env.AZURE_NON_PROD_WEB_APP_CLIENT_ID }}
