name: Main Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  BASE_APP_NAME: web-account-permissions
  PROD_ENV_NAME: prod
  PR_ENV_PREFIX: pr

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

      - name: Build app
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::021685463033:role/matthew-avp-github-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Set environment name
        id: envname
        run: |
          echo "value=${{ env.PROD_ENV_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Show environment summary
        run: |
          echo "Environment: ${{ steps.envname.outputs.value }}"
          echo "Web app client id (prod): a4c33926-3866-4824-a980-1b5c6faea83d"
          echo "Claims app client id (prod): 7435fe37-9648-427f-b315-bb33a0255e38"
